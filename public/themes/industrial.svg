<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2d33"/>
      <stop offset="40%" stop-color="#1a1c20"/>
      <stop offset="100%" stop-color="#0e1013"/>
    </linearGradient>
    <linearGradient id="warn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#ff6a00"/>
    </linearGradient>
    <pattern id="plate" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#181a1e"/>
      <path d="M0 40H80M40 0V80" stroke="#ffffff08" stroke-width="1"/>
      <circle cx="8" cy="8" r="3" fill="#0a0b0d" stroke="#3a3f48" stroke-width="1"/>
      <circle cx="72" cy="8" r="3" fill="#0a0b0d" stroke="#3a3f48" stroke-width="1"/>
      <circle cx="8" cy="72" r="3" fill="#0a0b0d" stroke="#3a3f48" stroke-width="1"/>
      <circle cx="72" cy="72" r="3" fill="#0a0b0d" stroke="#3a3f48" stroke-width="1"/>
    </pattern>
    <radialGradient id="spot" cx="20%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#f5a62322"/>
      <stop offset="100%" stop-color="#0000"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#metal)"/>
  <rect width="1600" height="900" fill="url(#plate)" opacity=".9"/>
  <rect width="1600" height="900" fill="url(#spot)"/>
  <!-- heavy beams -->
  <g fill="#121418" stroke="#3d4450" stroke-width="2">
    <rect x="0" y="120" width="1600" height="28"/>
    <rect x="0" y="760" width="1600" height="28"/>
    <rect x="180" y="0" width="24" height="900"/>
    <rect x="1380" y="0" width="24" height="900"/>
  </g>
  <!-- hazard stripes -->
  <g>
    <rect x="0" y="148" width="1600" height="18" fill="#1a1c20"/>
    <path d="M0 148H1600V166H0Z" fill="url(#warn)" opacity=".35" style="mask: repeating-linear-gradient(120deg,#000 0 12px,#0000 12px 24px)"/>
    <pattern id="haz" width="28" height="18" patternUnits="userSpaceOnUse" patternTransform="skewX(-28)">
      <rect width="14" height="18" fill="#f5a623"/>
      <rect x="14" width="14" height="18" fill="#111"/>
    </pattern>
    <rect x="0" y="148" width="1600" height="18" fill="url(#haz)" opacity=".55"/>
    <rect x="0" y="788" width="1600" height="18" fill="url(#haz)" opacity=".45"/>
  </g>
  <!-- gears -->
  <g fill="none" stroke="#f5a62355" stroke-width="3">
    <circle cx="1280" cy="260" r="70"/>
    <circle cx="1280" cy="260" r="42"/>
    <circle cx="1380" cy="340" r="48"/>
    <circle cx="1380" cy="340" r="28"/>
  </g>
  <g fill="#f5a62333">
    <circle cx="1280" cy="260" r="8"/>
    <circle cx="1380" cy="340" r="6"/>
  </g>
  <!-- pipe -->
  <g fill="#252830" stroke="#4a5160" stroke-width="2">
    <rect x="240" y="420" width="900" height="36" rx="6"/>
    <rect x="260" y="400" width="40" height="76" rx="4"/>
    <rect x="520" y="400" width="40" height="76" rx="4"/>
    <rect x="820" y="400" width="40" height="76" rx="4"/>
    <rect x="1060" y="400" width="40" height="76" rx="4"/>
  </g>
  <g fill="#ff6a0044">
    <circle cx="280" cy="438" r="6"/><circle cx="540" cy="438" r="6"/>
    <circle cx="840" cy="438" r="6"/><circle cx="1080" cy="438" r="6"/>
  </g>
</svg>
