name: PR stability gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex]

permissions:
  contents: read

concurrency:
  group: pr-stability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, test, and Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsqlite3-dev \
            pkg-config \
            ripgrep \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate PR structure and committed changes
        env:
          AI_HARNESS_BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: pnpm run check:ai

      - name: Run complete project gate
        run: pnpm run test:gate

      - name: Check Rust with all features
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-features

      - name: Check version and documentation consistency
        run: bash scripts/check-ssot.sh

  windows-package:
    name: Windows Tauri package
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        run: pnpm tauri build
