[package]
name = "linlis-work-panel"
version = "0.1.0"
description = "A local-first multi-agent group chat desktop app"
authors = ["LinlisWorkPanel contributors"]
edition = "2021"
default-run = "linlis-work-panel"

[features]
default = ["gui"]
gui = ["tauri", "tauri-plugin-dialog", "tauri-build"]

[lib]
name = "linlis_work_panel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [], optional = true }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8.1", features = [], optional = true }
tauri-plugin-dialog = { version = "2.2.0", optional = true }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.0", features = ["cors", "fs"] }
jsonwebtoken = "10.4.0"
argon2 = "0.5.3"
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "linlis-work-panel-server"
path = "src/main_server.rs"

[[bin]]
name = "linlis-work-panel"
path = "src/main.rs"
