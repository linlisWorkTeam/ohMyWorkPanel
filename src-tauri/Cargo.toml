[package]
name = "linlis-work-panel"
version = "0.1.0"
description = "A local-first multi-agent group chat desktop app"
authors = ["LinlisWorkPanel contributors"]
edition = "2021"

[lib]
name = "linlis_work_panel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8.1", features = [] }
tauri-plugin-dialog = "2.2.0"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
